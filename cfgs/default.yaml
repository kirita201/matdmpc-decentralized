# cfgs/default.yaml
modality: "state"
exp_name: "ma_tdmpc_baseline"
seed: 42
device: "cuda"

# Multi-Agent setup
task: "simple_spread"   # or "predator_prey"
num_agents: 6           # 3 / 6 / 15
obs_shape: [26]         # タスクとエージェント数に合わせて設定。make_task_cfg() で自動設定も可
action_dim: 5    # Discrete/Continuous mixed in MPE, assume continuous 5

# Training
train_steps: 500000
episode_length: 25
seed_steps: 5000
update_freq: 10
action_repeat: 1
eval_freq: 10000
eval_episodes: 10

# Buffer
max_buffer_size: 500000
batch_size: 512
per_alpha: 0.6
per_beta: "linear(0.4, 1.0, 500000)"

# Architecture (MACLM & Mixing)
latent_dim: 128
enc_dim: 256
mlp_dim: 256
n_com_layers: 2
n_heads: 4

# TD-MPC
horizon: 5
iterations: 6
num_samples: 512
mixture_coef: 0.05
num_elites: 64
temperature: 0.5
momentum: 0.1
min_std: 0.05
std_schedule: "linear(0.5, 0.05, 25000)"
horizon_schedule: "linear(1, 5, 25000)"

# Optimization
lr: 0.001
grad_clip_norm: 10.0
tau: 0.99 # Target EMA
discount: 0.95 # Gamma
rho: 0.5 # Temporal decay factor

# Loss Coefs
consistency_coef: 2.0
reward_coef: 0.5
value_coef: 0.1

# -------------------------------------------------------------------
# 分散通信設定
# -------------------------------------------------------------------
# obs_range  : 環境の観測範囲（MPEWrapper に渡す。null でテーブルデフォルト値使用）
# comm_range : アルゴリズム側の通信グラフ生成に使う距離閾値。
#              null または .inf を指定すると全結合（ベースライン等価）になる。
#              obs_range と comm_range は独立した概念であり、
#              「観測できるが通信しない」設定も将来的に可能。
#              典型的な実験では obs_range == comm_range == 1.0 を推奨。
obs_range: null          # 例: 1.0  (null → MPEWrapperのテーブルデフォルト)
comm_range: .inf         # 例: 1.0  (.inf → 全結合ベースライン)
# -------------------------------------------------------------------

# Prey Policy (predator_prey タスク時のみ使用)
prey_ckpt_path: null       # 例: "checkpoints/prey_N6.pt"
prey_noise_std: 0.05       # 推論時に加えるガウスノイズ (0 = 決定論的)

# Checkpointing
save_freq: 50000
resume: false
ckpt_dir: "checkpoints"