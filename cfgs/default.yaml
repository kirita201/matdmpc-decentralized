# cfgs/default.yaml
modality: "state"
exp_name: "ma_tdmpc_baseline"
seed: 42
device: "cuda"

# Multi-Agent setup
env_type: "vmas"        # "mpe" or "vmas"
task: "navigation"      # MPE: "simple_spread" or "predator_prey", VMAS: "navigation" 等
num_agents: 6           # 3 / 6 / 15
reward_type: "individual" # "global" or "individual"
obs_type: "local"       # "global" or "local"

# NOTE: obs_shape, action_dim は実行時に実測・自動設定されます

# Training
train_steps: 500000
episode_length: 50
seed_steps: 600
update_freq: 10
action_repeat: 1
eval_freq: 10000
eval_episodes: 10

# Buffer
max_buffer_size: 500000
batch_size: 512
per_alpha: 0.6
per_beta: "linear(0.4, 1.0, 500000)"

# Architecture (MACLM & Mixing)
latent_dim: 128
enc_dim: 256
mlp_dim: 256
n_com_layers: 2
n_heads: 4

# algo_type及びTD-MPC設定
algo_type: "asynch"      # "asynch", "synch", "maddpg", "mappo"
comm_type: "local"       # "none" (通信なし), "local" (局所通信), "global" (全体通信)
comm_range: 1.0          # 通信範囲 (float('inf') で全体通信)
horizon: 5
iterations: 6
num_samples: 512
mixture_coef: 0.05
num_elites: 64
temperature: 0.5
momentum: 0.1
min_std: 0.05
std_schedule: "linear(0.5, 0.05, 25000)"
horizon_schedule: "linear(1, 5, 25000)"

# Optimization
lr: 0.001
grad_clip_norm: 10.0
tau: 0.99 # Target EMA
discount: 0.99 # Gamma
rho: 0.5 # Temporal decay factor

# Loss Coefs
consistency_coef: 2.0
reward_coef: 0.5
value_coef: 0.1

# Prey Policy (predator_prey タスク時のみ使用)
# prey_ckpt_path を省略すると checkpoints/prey_N{num_agents}.pt を自動検索する。
# チェックポイントが存在しない場合はランダムポリシーにフォールバックし警告を表示。
prey_ckpt_path: null       # 例: "checkpoints/prey_N6.pt"
prey_noise_std: 0.05       # 推論時に加えるガウスノイズ (0 = 決定論的)

# Checkpointing
save_freq: 4400
resume: true
ckpt_dir: "checkpoints"



# MAPPO Specific
ppo_epochs: 5
ppo_clip_param: 0.2
entropy_coef: 0.01
rollout_length: 200      # 1エピソード長(episode_length)に合わせるか、その倍数が推奨
gae_lambda: 0.95